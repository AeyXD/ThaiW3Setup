name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      # A locally compiled bootloader does not share the signature of the prebuilt
      # one that malware authors also use, which avoids most antivirus false positives.
      - name: Install PyInstaller with bootloader built from source
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install --no-binary pyinstaller pyinstaller==6.15.0
          python -m pip install -r requirements.txt

      - name: Verify bootloader is not the prebuilt one
        run: |
          $prebuilt = "24B8B4E8C7C58BDDF3C35CBAC3BCA4C5D6866D287617E6BFE4D37129A39783FB"
          $dir = python -c "import os, PyInstaller; print(os.path.join(os.path.dirname(PyInstaller.__file__), 'bootloader', 'Windows-64bit-intel'))"
          $hash = (Get-FileHash (Join-Path $dir "runw.exe") -Algorithm SHA256).Hash
          Write-Host "runw.exe SHA256 $hash"
          if ($hash -eq $prebuilt) { Write-Error "bootloader was not compiled from source"; exit 1 }

      - name: Refresh bundled translations
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python -m core.sheet --export assets/translations.json.gz

      - name: Build
        id: build
        run: |
          "version=$(python -c 'import core; print(core.__version__)')" >> $env:GITHUB_OUTPUT
          python packaging/make_version_info.py
          python -m PyInstaller --noconfirm --clean ThaiW3Setup.spec
          Copy-Item README.md dist/ThaiW3Setup/README.md

      - name: Smoke test
        run: |
          $p = Start-Process dist/ThaiW3Setup/ThaiW3Setup.exe -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Upload unsigned build
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: ThaiW3Setup-unsigned
          path: dist/ThaiW3Setup

      - name: Sign with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ThaiW3Setup
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # every release waits for a manual approval in SignPath
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: dist/signed
          parameters: |
            version: ${{ toJSON(steps.build.outputs.version) }}

      - name: Use signed files
        if: env.SIGNPATH_API_TOKEN != ''
        run: |
          Remove-Item -Recurse -Force dist/ThaiW3Setup
          Move-Item dist/signed dist/ThaiW3Setup
          $sig = Get-AuthenticodeSignature dist/ThaiW3Setup/ThaiW3Setup.exe
          Write-Host "signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { Write-Error "ThaiW3Setup.exe is not validly signed"; exit 1 }

      - name: Package
        id: package
        run: |
          $version = python -c "import core; print(core.__version__)"
          $zip = "dist/ThaiW3Setup-$version.zip"
          Compress-Archive -Path dist/ThaiW3Setup -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ThaiW3Setup-$version.zip" | Out-File -Encoding ascii "$zip.sha256"
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Scan with VirusTotal
        id: virustotal
        if: env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            ${{ steps.package.outputs.zip }}
            dist/ThaiW3Setup/ThaiW3Setup.exe

      - name: Release notes
        run: >
          python packaging/release_notes.py
          "${{ steps.package.outputs.version }}"
          "${{ steps.package.outputs.sha256 }}"
          dist/notes.md
          "${{ steps.virustotal.outputs.analysis }}"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ThaiW3Setup-${{ steps.package.outputs.version }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/notes.md
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256

  # The macOS half. It only uploads a workflow artifact: the .app is not attached to the
  # release until someone has installed it against a real game in a bottle.
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build requirements
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -q -r requirements-build.txt
          .venv/bin/python -c "import PyInstaller; print('PyInstaller', PyInstaller.__version__)"

      - name: Test
        run: |
          .venv/bin/python devtools/test_pe_version.py
          .venv/bin/python devtools/test_wine.py
          .venv/bin/python devtools/test_update.py

      - name: Refresh bundled translations
        continue-on-error: true
        run: .venv/bin/python -m core.sheet --export assets/translations.json.gz

      - name: Build
        id: package
        run: |
          ./build.sh offline
          version=$(.venv/bin/python -c "import core; print(core.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=dist/ThaiW3Setup-$version-macos-$(uname -m).zip" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          dist/ThaiW3Setup.app/Contents/MacOS/ThaiW3Setup --version
          codesign --verify --deep --strict dist/ThaiW3Setup.app

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ThaiW3Setup-${{ steps.package.outputs.version }}-macos
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
